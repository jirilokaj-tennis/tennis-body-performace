*{box-sizing:border-box}body{margin:0;background:#f1f5f6;color:#18333d;font:16px -apple-system,BlinkMacSystemFont,Arial}header{background:#153947;color:white;padding:22px 16px}header h1{font-size:22px;margin:0}header small{color:#c0d9df}nav{display:flex;gap:6px;overflow:auto;background:white;padding:10px;position:sticky;top:0}button{cursor:pointer;border:0;border-radius:9px;padding:11px;background:#e7f0f2;color:#17485b;font-weight:600}nav button{white-space:nowrap}button.active,.primary{background:#14768b;color:white}main{max-width:780px;margin:auto;padding:14px 12px 65px}.card{background:white;border:1px solid #dce6e9;border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{display:block;color:#536d77;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;font:inherit;border:1px solid #cbdbe0;border-radius:9px;padding:10px;background:white;color:#18333d}textarea{min-height:65px}.wide{grid-column:1/-1}.primary{margin-top:12px}.item{border-top:1px solid #e6edef;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.item small{display:block;color:#637a82;margin-top:5px}.del{background:#ffeded;color:#a22;padding:7px 11px;height:35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eaf3f5;border-radius:10px;text-align:center;padding:12px 5px}.stat b{display:block;font-size:20px}.stat small{font-size:11px;color:#5c7580}.muted{color:#647b85;font-size:13px}.pill{display:inline-block;background:#e4f2f5;border-radius:30px;padding:5px 8px;font-size:12px;margin:4px 4px 0 0}.warning{background:#fff7e7;border-left:3px solid #dda33c;padding:12px;font-size:13px;border-radius:6px}a{color:#14768b}@media(max-width:450px){.grid{grid-template-columns:1fr}.stat b{font-size:17px}}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0}.calday{background:#f1f6f7;min-height:43px;border-radius:6px;text-align:center;padding:5px 1px;font-size:12px}.calday small{display:block;color:#14768b;font-size:10px}.dayname{text-align:center;font-size:11px;color:#647b85}.calcontrols{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calcontrols button{font-size:20px;padding:5px 14px}</style><header><h1>🎾 Tennis & Body Performance</h1><small>Mein persönlicher Offline-Planer</small></header><nav id="nav"></nav><main id="main"></main><script>
const KEY='tennis_body_performance_v1',T=['Übersicht','Ernährung','Training','Kraft & Core','Turniere','Körper','Daten'],K=['foods','training','tournaments','weights','water','workouts'];let page='Übersicht';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}}for(let k of K)if(!Array.isArray(data[k]))data[k]=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0),box=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`,field=(key,label,type='text',required='')=>`<div><label>${label}<input name="${key}" type="${type}" ${required} ${type==='date'?'value="'+today()+'"':''}></label></div>`,select=(key,label,options)=>`<div><label>${label}<select name="${key}">${options.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label></div>`,note=(key,label)=>`<div class="wide"><label>${label}<textarea name="${key}"></textarea></label></div>`,form=(id,fields,button='Speichern')=>`<form id="${id}"><div class="grid">${fields}</div><button class="primary">${button}</button></form>`,list=(k,format)=>[...data[k]].sort((a,b)=>(b.date||b.start||'').localeCompare(a.date||a.start||'')).map(x=>`<div class="item"><div>${format(x)}</div><button class="del" onclick="removeItem('${k}','${x.id}')">×</button></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>';function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen.');return false}}function add(k,form){let obj=Object.fromEntries(new FormData(form).entries());obj.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);data[k].push(obj);if(save())render()}function removeItem(k,id){if(confirm('Eintrag löschen?')){data[k]=data[k].filter(x=>x.id!==id);save();render()}}function overview(){let f=data.foods.filter(x=>x.date===today()),t=data.training.filter(x=>x.date===today()),w=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];return box('Heute · '+new Date().toLocaleDateString('de-CH'),`<div class="stats"><div class="stat"><b>${Math.round(sum(f,'kcal'))}</b><small>kcal</small></div><div class="stat"><b>${Math.round(sum(f,'protein'))} g</b><small>Protein</small></div><div class="stat"><b>${sum(t,'minutes')} min</b><small>Sport</small></div></div><p class="muted">Letztes Gewicht: ${w?esc(w.kg)+' kg':'–'} · Turniere: ${data.tournaments.length}</p>`)+box('Schnellstart','<p>Über die Reiter oben kannst du Mahlzeiten, Training, Turniere und Gewicht erfassen.</p><p class="warning">Daten bleiben auf diesem Gerät. Bitte regelmäßig im Bereich „Daten“ exportieren.</p>')+box('Meine Turniere',list('tournaments',x=>`<b>${esc(x.name)}</b><small>${esc(x.start)} · ${esc(x.kind)} · ${esc(x.age)}</small>`))}function nutrition(){return waterView()+mealImportView()+box('Essen eintragen',form('food',field('date','Datum','date','required')+field('name','Gericht / Lebensmittel','text','required')+field('kcal','Kalorien (kcal)','number','min="0" required')+field('protein','Protein (g)','number','min="0" step="0.1" required')+field('sugar','Zucker (g)','number','min="0" step="0.1"')+select('meal','Mahlzeit',['Frühstück','Mittagessen','Abendessen','Snack'])))+box('Ernährungstagebuch',list('foods',x=>`<b>${esc(x.name)}</b><small>${esc(x.date)} · ${esc(x.meal)} · ${esc(x.kcal)} kcal · ${esc(x.protein)} g Protein</small>`))}
const workoutPlans=[
{title:'A · Beine & Gesäß',days:'Montag',moves:[['🏋️','Goblet Squat (schmerzfrei)','4–6 kg · 3 × 10'],['🦵','Niedriger Step-up','2 × 10 je Bein'],['🌉','Glute Bridge','3 × 15'],['🪢','Band-Rudern','3 × 12']]},
{title:'B · Oberkörper',days:'Mittwoch',moves:[['🪢','Band-Rudern','3 × 12'],['💪','Kettlebell Floor Press','4–6 kg · 3 × 10'],['🪢','Band Pull-apart','2 × 15'],['🧍','Suitcase Carry','6 kg · 3 × 30 Sek. je Seite']]},
{title:'C · Beine & Stabilität',days:'Freitag',moves:[['🏋️','Kettlebell Deadlift','6 kg · 3 × 12'],['🪢','Band-Seitwärtsschritte','3 × 10 je Seite'],['🌉','Glute Bridge','3 × 15'],['🧍','Einbeinstand','3 × 30 Sek. je Bein']]},
{title:'Core · täglich (leicht / kräftig abwechseln)',days:'Täglich',moves:[['🪲','Dead Bug','2 × 8 je Seite'],['🧘','Side Plank','2 × 20–30 Sek. je Seite'],['🔁','Reverse Crunch','2 × 10']]},
{title:'Schnelligkeit · 2× pro Woche',days:'Dienstag / Samstag',moves:[['🎾','Split-Step + erster Schritt','6 × 5 m'],['↔️','Seitwärtsbewegung','6 × 5 m'],['⚡','Kurzer Sprint','4 × 10 m, volle Pause']]},
{title:'Dehnen & Mobility · täglich',days:'Täglich',moves:[['🦵','Hüftbeuger dehnen','2 × 25 Sek. je Seite'],['🧘','Wade dehnen','2 × 25 Sek. je Seite'],['↗️','Brustwirbelsäule mobilisieren','2 × 8 je Seite']]}];
function workout(){let date=today(),records=data.workouts.filter(x=>x.date===date),completed=records.length,total=workoutPlans.reduce((n,p)=>n+p.moves.length,0);return box('Mein Trainingsplan',`<p class="muted">Kettlebells 4 / 6 kg · lange Widerstandsbänder · Core täglich · kein Ausdauerlauf. Bei Schmerzen abbrechen. Kraftübungen mit kontrollierter Technik, Sprints nur nach Aufwärmen und schmerzfrei.</p><label>Trainingstag<input id="workDate" type="date" value="${esc(window.workDate||date)}" onchange="window.workDate=this.value;render()"></label><p><b>${data.workouts.filter(x=>x.date===(window.workDate||date)).length} Übungen erledigt</b></p>`)+workoutPlans.map((plan,pi)=>box(esc(plan.title),`<p class="muted">${esc(plan.days)}</p>`+plan.moves.map((m,mi)=>{let d=window.workDate||date,done=data.workouts.some(x=>x.date===d&&x.key===pi+'-'+mi);return `<div class="item"><div style="flex:1"><b>${m[0]} ${esc(m[1])}</b><small>${esc(m[2])}</small></div><label style="white-space:nowrap"><input aria-label="${esc(m[1])} erledigt" style="width:auto" type="checkbox" ${done?'checked':''} onchange="toggleExercise('${pi}-${mi}',this.checked)"> Erledigt</label></div>`}).join(''))).join('')+box('Hinweis','<p class="muted">Symbole dienen als Orientierung, nicht als Übungsanleitung. Für die richtige Technik zunächst die Bewegungen prüfen. An müden Tagen Core nur leicht ausführen. Für Muskelaufbau Belastung später schrittweise steigern.</p>')}
function toggleExercise(key,checked){let date=window.workDate||today();data.workouts=data.workouts.filter(x=>!(x.date===date&&x.key===key));if(checked)data.workouts.push({date,key});if(save())render()}
function addWater(ml){data.water.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:today(),ml});if(save())render()}
function removeWater(){let x=[...data.water].reverse().find(x=>x.date===today());if(x){data.water=data.water.filter(y=>y.id!==x.id);save();render()}}
function waterView(){let goal=Number(localStorage.getItem('tbp_water_goal')||3000),current=sum(data.water.filter(x=>x.date===today()),'ml'),last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let date=d.toLocaleDateString('en-CA');return {date,ml:sum(data.water.filter(x=>x.date===date),'ml')}});return box('💧 Wassertracker · nur Wasser',`<div class="stats"><div class="stat"><b>${current} ml</b><small>Heute</small></div><div class="stat"><b>${goal} ml</b><small>Tagesziel</small></div><div class="stat"><b>${Math.round(current/goal*100)}%</b><small>Erreicht</small></div></div><div style="height:12px;background:#e4eef2;border-radius:9px;margin:14px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,current/goal*100)}%;background:#2189c5"></div></div><div style="display:flex;flex-wrap:wrap;gap:8px"><button onclick="addWater(150)">+150 ml</button><button onclick="addWater(250)">+250 ml</button><button onclick="addWater(500)">+500 ml</button><button onclick="removeWater()">↩ Rückgängig</button></div><p><label>Tagesziel (ml)<input type="number" min="500" max="10000" step="50" value="${goal}" onchange="if(+this.value>=500&&+this.value<=10000){localStorage.setItem('tbp_water_goal',this.value);render()}"></label></p><p class="muted">Nur reines Wasser. Tagesziel ist individuell anpassbar; bei starkem Schwitzen auch Elektrolyte beachten.</p><b>Letzte 7 Tage</b>${last7.map(x=>`<div class="item"><span>${esc(x.date)}</span><b>${x.ml} ml</b></div>`).join('')}`)}
function importMeal(){let raw=$('mealImportText').value.trim();try{if(raw.length>5000)throw Error('Text zu lang');let x=JSON.parse(raw);if(!x||Array.isArray(x)||typeof x!=='object')throw Error('Ungültiges Format');let name=String(x.name||'').trim().slice(0,120),kcal=Number(x.kcal),protein=Number(x.protein),sugar=Number(x.sugar||0);if(!name||![kcal,protein,sugar].every(Number.isFinite)||kcal<0||kcal>5000||protein<0||protein>500||sugar<0||sugar>500)throw Error('Werte prüfen');if(!confirm(name+' · '+kcal+' kcal · '+protein+' g Protein speichern?'))return;data.foods.push({id:Date.now().toString(36),date:today(),name,kcal,protein,sugar,meal:'Snack'});if(save())render()}catch(e){alert('Import nicht möglich: '+e.message)}}
function mealImportView(){return box('📋 Mahlzeit aus ChatGPT übernehmen',`<p class="muted">Kopiere die von ChatGPT geschätzten Werte als JSON hier hinein. Ohne Konto, ohne automatische Verbindung. Angaben sind Schätzungen.</p><textarea id="mealImportText" placeholder='{"name":"Brot und Käse","kcal":420,"protein":18,"sugar":5}'></textarea><button class="primary" onclick="importMeal()">Mahlzeit prüfen & speichern</button>`)}
function training(){return box('Training eintragen',form('train',field('date','Datum','date','required')+select('type','Sport',['Tennis Training','Tennis Match','Krafttraining','Ausdauer','Schnelligkeit','Regeneration','Andere'])+field('minutes','Minuten','number','min="1" required')+select('intensity','Intensität',['Leicht','Mittel','Hoch'])+note('notes','Notizen / Matchresultat')))+box('Trainingstagebuch',list('training',x=>`<b>${esc(x.type)} · ${esc(x.minutes)} min</b><small>${esc(x.date)} · ${esc(x.intensity)} · ${esc(x.notes)}</small>`))}const CKEY='tbp_calendar_v12';let catalog=[];try{const saved=JSON.parse(localStorage.getItem(CKEY));if(Array.isArray(saved))catalog=saved}catch{}let calMonth=new Date().toISOString().slice(0,7),calFilter='Alle';const sourceLinks='<a href="https://www.itftennis.com/en/tournament-calendar/world-tennis-masters-tour-calendar/" target="_blank" rel="noopener noreferrer">ITF Masters ↗</a> · <a href="https://www.swisstennis.ch/" target="_blank" rel="noopener noreferrer">Swiss Tennis ↗</a>';function safeCatalog(input){if(!Array.isArray(input)||input.length>3000)throw Error('Ungültige Liste');return input.map((x,i)=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Ungültiger Eintrag');let y={};for(let k of ['name','start','end','place','kind','age','surface','url']){y[k]=String(x[k]??'').slice(0,250)}if(!y.name||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(y.start)||!Number.isFinite(Date.parse(y.start+'T12:00:00')))throw Error('Name/Datum fehlt');if(y.url&&!/^https:\/\//i.test(y.url))y.url='';y.id=String(x.id||'').slice(0,100)||'import-'+i;return y})}function calView(){let [yr,mo]=calMonth.split('-').map(Number),first=(new Date(yr,mo-1,1).getDay()+6)%7,days=new Date(yr,mo,0).getDate(),all=[...catalog.map(x=>({...x,external:true})),...data.tournaments.map(x=>({...x,external:false}))],filtered=all.filter(x=>calFilter==='Alle'||(calFilter==='Meine'?!x.external:calFilter==='ITF'?x.kind.includes('ITF'):calFilter==='Schweiz'?x.kind.includes('Swiss')||x.kind.includes('Schweizer'):true));let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dayname">${x}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('');for(let d=1;d<=days;d++){let date=calMonth+'-'+String(d).padStart(2,'0'),n=filtered.filter(x=>x.start<=date&&(x.end||x.start)>=date).length;cells+=`<div class="calday"><b>${d}</b>${n?`<small>${n} 🎾</small>`:''}</div>`}let entries=filtered.filter(x=>x.start.slice(0,7)<=calMonth&&(x.end||x.start).slice(0,7)>=calMonth).sort((a,b)=>a.start.localeCompare(b.start));return box('Turnierkalender',`<div class="calcontrols"><button onclick="changeMonth(-1)">‹</button><b>${new Date(yr,mo-1,1).toLocaleDateString('de-CH',{month:'long',year:'numeric'})}</b><button onclick="changeMonth(1)">›</button></div><label>Filter<select id="calfilter" onchange="calFilter=this.value;render()">${['Alle','ITF','Schweiz','Meine'].map(v=>`<option ${calFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="calendar">${cells}</div><p class="muted">● Tage mit Turnieren · Offline gespeichert</p>`)+box('Turniere im Monat',entries.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><small>${esc(x.start)}${x.end?' – '+esc(x.end):''} · ${esc(x.place)}<br>${esc(x.kind)} · ${esc(x.age)}</small>${x.url?`<small><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Offizielle Seite ↗</a></small>`:''}</div>${x.external?`<button onclick="planCatalog('${esc(x.id).replace(/'/g,'&#39;')}')">+ Planen</button>`:''}</div>`).join('')||'<p class="muted">Keine Turniere in diesem Monat.</p>')+box('Turnierdaten aktualisieren',`<p class="warning">Automatischer Abruf ist noch nicht aktiviert. Offizielle Webseiten erlauben nicht immer den direkten Datenzugriff. Keine unbestätigten Turniere werden erfunden.</p><p>${sourceLinks}</p><label>Turnierliste als JSON importieren<input type="file" id="catalogImport" accept=".json,application/json"></label><p class="muted">Format: Liste von Objekten mit name, start (JJJJ-MM-TT), end, place, kind, age, surface und optional url. Import ersetzt nur die externe Turnierliste, nicht deine persönlichen Daten. Aktuell: ${catalog.length} importierte Turniere.</p><button onclick="exportCatalog()">Turnierliste exportieren</button>`)}function changeMonth(n){let [y,m]=calMonth.split('-').map(Number);calMonth=new Date(y,m-1+n,1).toISOString().slice(0,7);render()}function planCatalog(id){let x=catalog.find(t=>t.id===id);if(!x)return;data.tournaments.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:x.name,kind:x.kind,start:x.start,end:x.end,place:x.place,age:x.age,surface:x.surface,priority:'Optional',status:'Interessiert',deadline:'',notes:x.url||''});if(save())render()}function exportCatalog(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(catalog,null,2)],{type:'application/json'}));a.href=u;a.download='turnierliste.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function tournaments(){return calView()+box('Turnier manuell planen',form('tour',field('name','Turniername','text','required')+select('kind','Kategorie',['ITF MT700','ITF MT1000','ITF Weltmeisterschaft','Swiss Tennis','Schweizer Meisterschaft','Andere'])+field('start','Beginn','date','required')+field('end','Ende','date')+field('place','Ort / Land')+select('age','Altersklasse',['45+','50+','Beide','Andere'])+select('surface','Belag',['Sand','Hartplatz','Rasen','Teppich','Unbekannt'])+select('priority','Bedeutung',['Hauptziel','Vorbereitungsturnier','Optional'])+select('status','Status',['Interessiert','Geplant','Angemeldet','Gespielt'])+field('deadline','Anmeldeschluss','date')+note('notes','Reise, Kosten, Vorbereitung, Ergebnisse, Punkte'),'Turnier hinzufügen'))+box('Meine Turniere',list('tournaments',x=>`<b>${esc(x.name)}</b><small>${esc(x.start)}${x.end?' – '+esc(x.end):''} · ${esc(x.place)}<br>${esc(x.kind)} · ${esc(x.age)} · ${esc(x.surface)}</small><span class="pill">${esc(x.priority)}</span><span class="pill">${esc(x.status)}</span>`))}function body(){return box('Körperwerte',form('weight',field('date','Datum','date','required')+field('kg','Gewicht (kg)','number','min="20" max="300" step="0.1" required')+field('waist','Bauchumfang (cm)','number','min="0" step="0.1"')))+box('Verlauf',list('weights',x=>`<b>${esc(x.kg)} kg</b><small>${esc(x.date)}${x.waist?' · '+esc(x.waist)+' cm Bauchumfang':''}</small>`))}function settings(){return box('Sicherung & Wiederherstellung','<p>Exportiere regelmäßig deine Daten als JSON-Datei.</p><button class="primary" onclick="exportData()">Sicherung herunterladen</button><p><label>Gesicherte Daten importieren<input type="file" id="import" accept=".json,application/json"></label></p><p class="warning">Import ersetzt alle aktuellen Einträge. Zuerst eine Sicherung erstellen.</p>')+box('Offline & Datenschutz','<p>Keine Anmeldung, keine Werbung, keine Cloud und kein Abo. Alle Daten bleiben im Browser auf diesem Gerät. iPhone und Mac synchronisieren nicht automatisch.</p><p class="muted">Wenn Browserdaten gelöscht werden, können Einträge verloren gehen. Eine lokale HTML-Datei und Browser-Speicher funktionieren je nach iOS-Version unterschiedlich; deshalb zuerst einen Testeintrag und Export prüfen.</p>')}function exportData(){let blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tennis-body-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){$('nav').innerHTML=T.map(x=>`<button class="${page===x?'active':''}" data-page="${x}">${x}</button>`).join('');$('main').innerHTML=({Übersicht:overview,Ernährung:nutrition,Training:training,'Kraft & Core':workout,Turniere:tournaments,Körper:body,Daten:settings})[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});for(let [id,k] of [['food','foods'],['train','training'],['tour','tournaments'],['weight','weights']]){let f=$(id);if(f)f.onsubmit=e=>{e.preventDefault();add(k,f)}}let ci=$('catalogImport');if(ci)ci.onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Datei zu groß');let items=safeCatalog(JSON.parse(await f.text()));if(confirm(items.length+' Turniere importieren?')){localStorage.setItem(CKEY,JSON.stringify(items));catalog=items;render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}};let inp=$('import');if(inp)inp.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!['foods','training','tournaments','weights'].every(k=>Array.isArray(d[k])))throw Error('Ungültiges Format');for(let k of ['water','workouts'])if(!Array.isArray(d[k]))d[k]=[];if(confirm('Alle aktuellen Einträge durch Sicherung ersetzen?')){data=Object.fromEntries(K.map(k=>[k,d[k]]));save();render()}}catch{alert('Die Sicherung konnte nicht gelesen werden.')}}}render();
