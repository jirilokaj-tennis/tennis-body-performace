<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153947"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tennis Body"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" type="image/png" href="./icons/icon-192.png"><title>Tennis & Body Performance</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f6;color:#18333d;font:16px -apple-system,BlinkMacSystemFont,Arial}header{background:#153947;color:white;padding:22px 16px}header h1{font-size:22px;margin:0}header small{color:#c0d9df}nav{display:flex;gap:6px;overflow:auto;background:white;padding:10px;position:sticky;top:0}button{cursor:pointer;border:0;border-radius:9px;padding:11px;background:#e7f0f2;color:#17485b;font-weight:600}nav button{white-space:nowrap}button.active,.primary{background:#14768b;color:white}main{max-width:780px;margin:auto;padding:14px 12px 65px}.card{background:white;border:1px solid #dce6e9;border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{display:block;color:#536d77;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;font:inherit;border:1px solid #cbdbe0;border-radius:9px;padding:10px;background:white;color:#18333d}textarea{min-height:65px}.wide{grid-column:1/-1}.primary{margin-top:12px}.item{border-top:1px solid #e6edef;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.item small{display:block;color:#637a82;margin-top:5px}.del{background:#ffeded;color:#a22;padding:7px 11px;height:35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eaf3f5;border-radius:10px;text-align:center;padding:12px 5px}.stat b{display:block;font-size:20px}.stat small{font-size:11px;color:#5c7580}.muted{color:#647b85;font-size:13px}.pill{display:inline-block;background:#e4f2f5;border-radius:30px;padding:5px 8px;font-size:12px;margin:4px 4px 0 0}.warning{background:#fff7e7;border-left:3px solid #dda33c;padding:12px;font-size:13px;border-radius:6px}a{color:#14768b}@media(max-width:450px){.grid{grid-template-columns:1fr}.stat b{font-size:17px}}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0}.calday{background:#f1f6f7;min-height:43px;border-radius:6px;text-align:center;padding:5px 1px;font-size:12px}.calday small{display:block;color:#14768b;font-size:10px}.dayname{text-align:center;font-size:11px;color:#647b85}.calcontrols{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calcontrols button{font-size:20px;padding:5px 14px}</style><header><h1>🎾 Tennis & Body Performance</h1><small>Mein persönlicher Offline-Planer</small></header><nav id="nav"></nav><main id="main"></main><script>
const KEY='tennis_body_performance_v1',T=['Übersicht','Ernährung','Training','Turniere','Körper','Daten'],K=['foods','training','tournaments','weights'];let page='Übersicht';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}}for(let k of K)if(!Array.isArray(data[k]))data[k]=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0),box=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`,field=(key,label,type='text',required='')=>`<div><label>${label}<input name="${key}" type="${type}" ${required} ${type==='date'?'value="'+today()+'"':''}></label></div>`,select=(key,label,options)=>`<div><label>${label}<select name="${key}">${options.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label></div>`,note=(key,label)=>`<div class="wide"><label>${label}<textarea name="${key}"></textarea></label></div>`,form=(id,fields,button='Speichern')=>`<form id="${id}"><div class="grid">${fields}</div><button class="primary">${button}</button></form>`,list=(k,format)=>[...data[k]].sort((a,b)=>(b.date||b.start||'').localeCompare(a.date||a.start||'')).map(x=>`<div class="item"><div>${format(x)}</div><button class="del" onclick="removeItem('${k}','${x.id}')">×</button></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>';function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen.');return false}}function add(k,form){let obj=Object.fromEntries(new FormData(form).entries());obj.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);data[k].push(obj);if(save())render()}function removeItem(k,id){if(confirm('Eintrag löschen?')){data[k]=data[k].filter(x=>x.id!==id);save();render()}}function overview(){let f=data.foods.filter(x=>x.date===today()),t=data.training.filter(x=>x.date===today()),w=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];return box('Heute · '+new Date().toLocaleDateString('de-CH'),`<div class="stats"><div class="stat"><b>${Math.round(sum(f,'kcal'))}</b><small>kcal</small></div><div class="stat"><b>${Math.round(sum(f,'protein'))} g</b><small>Protein</small></div><div class="stat"><b>${sum(t,'minutes')} min</b><small>Sport</small></div></div><p class="muted">Letztes Gewicht: ${w?esc(w.kg)+' kg':'–'} · Turniere: ${data.tournaments.length}</p>`)+box('Schnellstart','<p>Über die Reiter oben kannst du Mahlzeiten, Training, Turniere und Gewicht erfassen.</p><p class="warning">Daten bleiben auf diesem Gerät. Bitte regelmäßig im Bereich „Daten“ exportieren.</p>')+box('Meine Turniere',list('tournaments',x=>`<b>${esc(x.name)}</b><small>${esc(x.start)} · ${esc(x.kind)} · ${esc(x.age)}</small>`))}function nutrition(){return box('Essen eintragen',form('food',field('date','Datum','date','required')+field('name','Gericht / Lebensmittel','text','required')+field('kcal','Kalorien (kcal)','number','min="0" required')+field('protein','Protein (g)','number','min="0" step="0.1" required')+field('sugar','Zucker (g)','number','min="0" step="0.1"')+select('meal','Mahlzeit',['Frühstück','Mittagessen','Abendessen','Snack'])))+box('Ernährungstagebuch',list('foods',x=>`<b>${esc(x.name)}</b><small>${esc(x.date)} · ${esc(x.meal)} · ${esc(x.kcal)} kcal · ${esc(x.protein)} g Protein</small>`))}function training(){return box('Training eintragen',form('train',field('date','Datum','date','required')+select('type','Sport',['Tennis Training','Tennis Match','Krafttraining','Ausdauer','Schnelligkeit','Regeneration','Andere'])+field('minutes','Minuten','number','min="1" required')+select('intensity','Intensität',['Leicht','Mittel','Hoch'])+note('notes','Notizen / Matchresultat')))+box('Trainingstagebuch',list('training',x=>`<b>${esc(x.type)} · ${esc(x.minutes)} min</b><small>${esc(x.date)} · ${esc(x.intensity)} · ${esc(x.notes)}</small>`))}const CKEY='tbp_calendar_v12';let catalog=[];try{const saved=JSON.parse(localStorage.getItem(CKEY));if(Array.isArray(saved))catalog=saved}catch{}let calMonth=new Date().toISOString().slice(0,7),calFilter='Alle';const sourceLinks='<a href="https://www.itftennis.com/en/tournament-calendar/world-tennis-masters-tour-calendar/" target="_blank" rel="noopener noreferrer">ITF Masters ↗</a> · <a href="https://www.swisstennis.ch/" target="_blank" rel="noopener noreferrer">Swiss Tennis ↗</a>';function safeCatalog(input){if(!Array.isArray(input)||input.length>3000)throw Error('Ungültige Liste');return input.map((x,i)=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Ungültiger Eintrag');let y={};for(let k of ['name','start','end','place','kind','age','surface','url']){y[k]=String(x[k]??'').slice(0,250)}if(!y.name||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(y.start)||!Number.isFinite(Date.parse(y.start+'T12:00:00')))throw Error('Name/Datum fehlt');if(y.url&&!/^https:\/\//i.test(y.url))y.url='';y.id=String(x.id||'').slice(0,100)||'import-'+i;return y})}function calView(){let [yr,mo]=calMonth.split('-').map(Number),first=(new Date(yr,mo-1,1).getDay()+6)%7,days=new Date(yr,mo,0).getDate(),all=[...catalog.map(x=>({...x,external:true})),...data.tournaments.map(x=>({...x,external:false}))],filtered=all.filter(x=>calFilter==='Alle'||(calFilter==='Meine'?!x.external:calFilter==='ITF'?x.kind.includes('ITF'):calFilter==='Schweiz'?x.kind.includes('Swiss')||x.kind.includes('Schweizer'):true));let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dayname">${x}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('');for(let d=1;d<=days;d++){let date=calMonth+'-'+String(d).padStart(2,'0'),n=filtered.filter(x=>x.start<=date&&(x.end||x.start)>=date).length;cells+=`<div class="calday"><b>${d}</b>${n?`<small>${n} 🎾</small>`:''}</div>`}let entries=filtered.filter(x=>x.start.slice(0,7)<=calMonth&&(x.end||x.start).slice(0,7)>=calMonth).sort((a,b)=>a.start.localeCompare(b.start));return box('Turnierkalender',`<div class="calcontrols"><button onclick="changeMonth(-1)">‹</button><b>${new Date(yr,mo-1,1).toLocaleDateString('de-CH',{month:'long',year:'numeric'})}</b><button onclick="changeMonth(1)">›</button></div><label>Filter<select id="calfilter" onchange="calFilter=this.value;render()">${['Alle','ITF','Schweiz','Meine'].map(v=>`<option ${calFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="calendar">${cells}</div><p class="muted">● Tage mit Turnieren · Offline gespeichert</p>`)+box('Turniere im Monat',entries.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><small>${esc(x.start)}${x.end?' – '+esc(x.end):''} · ${esc(x.place)}<br>${esc(x.kind)} · ${esc(x.age)}</small>${x.url?`<small><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Offizielle Seite ↗</a></small>`:''}</div>${x.external?`<button onclick="planCatalog('${esc(x.id).replace(/'/g,'&#39;')}')">+ Planen</button>`:''}</div>`).join('')||'<p class="muted">Keine Turniere in diesem Monat.</p>')+box('Turnierdaten aktualisieren',`<p class="warning">Automatischer Abruf ist noch nicht aktiviert. Offizielle Webseiten erlauben nicht immer den direkten Datenzugriff. Keine unbestätigten Turniere werden erfunden.</p><p>${sourceLinks}</p><label>Turnierliste als JSON importieren<input type="file" id="catalogImport" accept=".json,application/json"></label><p class="muted">Format: Liste von Objekten mit name, start (JJJJ-MM-TT), end, place, kind, age, surface und optional url. Import ersetzt nur die externe Turnierliste, nicht deine persönlichen Daten. Aktuell: ${catalog.length} importierte Turniere.</p><button onclick="exportCatalog()">Turnierliste exportieren</button>`)}function changeMonth(n){let [y,m]=calMonth.split('-').map(Number);calMonth=new Date(y,m-1+n,1).toISOString().slice(0,7);render()}function planCatalog(id){let x=catalog.find(t=>t.id===id);if(!x)return;data.tournaments.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:x.name,kind:x.kind,start:x.start,end:x.end,place:x.place,age:x.age,surface:x.surface,priority:'Optional',status:'Interessiert',deadline:'',notes:x.url||''});if(save())render()}function exportCatalog(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(catalog,null,2)],{type:'application/json'}));a.href=u;a.download='turnierliste.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function tournaments(){return calView()+box('Turnier manuell planen',form('tour',field('name','Turniername','text','required')+select('kind','Kategorie',['ITF MT700','ITF MT1000','ITF Weltmeisterschaft','Swiss Tennis','Schweizer Meisterschaft','Andere'])+field('start','Beginn','date','required')+field('end','Ende','date')+field('place','Ort / Land')+select('age','Altersklasse',['45+','50+','Beide','Andere'])+select('surface','Belag',['Sand','Hartplatz','Rasen','Teppich','Unbekannt'])+select('priority','Bedeutung',['Hauptziel','Vorbereitungsturnier','Optional'])+select('status','Status',['Interessiert','Geplant','Angemeldet','Gespielt'])+field('deadline','Anmeldeschluss','date')+note('notes','Reise, Kosten, Vorbereitung, Ergebnisse, Punkte'),'Turnier hinzufügen'))+box('Meine Turniere',list('tournaments',x=>`<b>${esc(x.name)}</b><small>${esc(x.start)}${x.end?' – '+esc(x.end):''} · ${esc(x.place)}<br>${esc(x.kind)} · ${esc(x.age)} · ${esc(x.surface)}</small><span class="pill">${esc(x.priority)}</span><span class="pill">${esc(x.status)}</span>`))}function body(){return box('Körperwerte',form('weight',field('date','Datum','date','required')+field('kg','Gewicht (kg)','number','min="20" max="300" step="0.1" required')+field('waist','Bauchumfang (cm)','number','min="0" step="0.1"')))+box('Verlauf',list('weights',x=>`<b>${esc(x.kg)} kg</b><small>${esc(x.date)}${x.waist?' · '+esc(x.waist)+' cm Bauchumfang':''}</small>`))}function settings(){return box('Sicherung & Wiederherstellung','<p>Exportiere regelmäßig deine Daten als JSON-Datei.</p><button class="primary" onclick="exportData()">Sicherung herunterladen</button><p><label>Gesicherte Daten importieren<input type="file" id="import" accept=".json,application/json"></label></p><p class="warning">Import ersetzt alle aktuellen Einträge. Zuerst eine Sicherung erstellen.</p>')+box('Offline & Datenschutz','<p>Keine Anmeldung, keine Werbung, keine Cloud und kein Abo. Alle Daten bleiben im Browser auf diesem Gerät. iPhone und Mac synchronisieren nicht automatisch.</p><p class="muted">Wenn Browserdaten gelöscht werden, können Einträge verloren gehen. Eine lokale HTML-Datei und Browser-Speicher funktionieren je nach iOS-Version unterschiedlich; deshalb zuerst einen Testeintrag und Export prüfen.</p>')}function exportData(){let blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tennis-body-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){$('nav').innerHTML=T.map(x=>`<button class="${page===x?'active':''}" data-page="${x}">${x}</button>`).join('');$('main').innerHTML=({Übersicht:overview,Ernährung:nutrition,Training:training,Turniere:tournaments,Körper:body,Daten:settings})[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});for(let [id,k] of [['food','foods'],['train','training'],['tour','tournaments'],['weight','weights']]){let f=$(id);if(f)f.onsubmit=e=>{e.preventDefault();add(k,f)}}let ci=$('catalogImport');if(ci)ci.onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Datei zu groß');let items=safeCatalog(JSON.parse(await f.text()));if(confirm(items.length+' Turniere importieren?')){localStorage.setItem(CKEY,JSON.stringify(items));catalog=items;render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}};let inp=$('import');if(inp)inp.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!K.every(k=>Array.isArray(d[k])))throw Error('Ungültiges Format');if(confirm('Alle aktuellen Einträge durch Sicherung ersetzen?')){data=Object.fromEntries(K.map(k=>[k,d[k]]));save();render()}}catch{alert('Die Sicherung konnte nicht gelesen werden.')}}}render();
